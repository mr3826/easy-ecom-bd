name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build standalone app
        run: npm run build

      - name: Prepare deploy bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-package
          mkdir -p deploy-package/.next
          cp -R .next/standalone/. deploy-package/
          cp -R .next/static deploy-package/.next/static
          cp -R public deploy-package/public

      - name: Check cPanel FTP secrets
        id: cpanel-ftp
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${FTP_SERVER:-}" ] || missing+=("CPANEL_FTP_SERVER")
          [ -n "${FTP_USERNAME:-}" ] || missing+=("CPANEL_FTP_USERNAME")
          [ -n "${FTP_PASSWORD:-}" ] || missing+=("CPANEL_FTP_PASSWORD")

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          printf 'missing=%s\n' "${missing[*]}" >> "$GITHUB_OUTPUT"
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}

      - name: Skip FTP deploy
        if: steps.cpanel-ftp.outputs.enabled != 'true'
        shell: bash
        run: |
          echo "::warning::Skipping FTP deploy because these secrets are not configured: ${{ steps.cpanel-ftp.outputs.missing }}"

      - name: Deploy with FTP
        if: steps.cpanel-ftp.outputs.enabled == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.1
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./deploy-package
          server-dir: /
          exclude: |
            tmp/
          state-name: .cpanel-ftp-deploy.json
          dry-run: false
          dangerous-clean-slate: false
