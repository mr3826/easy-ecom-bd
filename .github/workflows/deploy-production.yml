name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm_app_root:
        description: 'Type the Passenger app root exactly to confirm the deploy target (it must match the APP_ROOT secret)'
        required: true
      dry_run:
        description: 'Build and assemble the release bundle but upload nothing. Run this first after any change to the deploy path.'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      # checks.listForRef backs the green-CI gate below; without this the gate
      # fails with "Resource not accessible by integration" and blocks every
      # deploy regardless of whether CI passed.
      checks: read

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      DEPLOY_RESTART_TOKEN: ${{ secrets.DEPLOY_RESTART_TOKEN }}
      # This repository is public, so no script here ships a topology default —
      # every ops script resolves these through scripts/deploy-settings.ps1 and
      # fails loudly when one is missing.
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_HOME: ${{ secrets.CPANEL_HOME }}
      APP_ROOT: ${{ secrets.APP_ROOT }}
      APP_URL: ${{ secrets.APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # workflow_dispatch will happily ship any ref, including one CI never saw.
      # Require a successful CI run for this exact SHA before touching
      # production. deploy-cpanel.ps1 also runs lint/typecheck/test itself, but
      # it has no database, so only CI proves the integration suite passed.
      - name: Require green CI for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const runs = data.check_runs.map(r => `${r.name}=${r.conclusion ?? r.status}`);
            const ok = data.check_runs.some(r => r.name === 'ci' && r.conclusion === 'success');
            if (!ok) {
              // List what was actually found: a renamed CI job would otherwise
              // block every deploy with no clue why.
              core.setFailed(
                `No successful 'ci' check for ${context.sha}. Found: ${runs.join(', ') || '(none)'}. ` +
                `Push this commit through CI before deploying.`
              );
            } else {
              core.info(`CI is green for ${context.sha}.`);
            }

      - name: Preflight
        shell: pwsh
        run: .\scripts\cpanel-preflight.ps1

      - name: Deploy to cPanel
        shell: pwsh
        run: |
          # MUST be a hashtable. Splatting an ARRAY binds positionally: the
          # script received AppRoot='-AppRoot' and silently dropped -DryRun, so
          # a dry run would have performed a real deploy had the ConfirmAppRoot
          # guard not caught the mangled value first. Not $args either — that is
          # an automatic variable in PowerShell.
          # AppRoot is left unset on purpose: deploy-cpanel.ps1 resolves it from
          # the APP_ROOT secret exported above. Passing it here would reintroduce
          # the literal this repo no longer publishes.
          $deployArgs = @{
            ConfirmAppRoot = '${{ github.event.inputs.confirm_app_root }}'
          }
          if ('${{ github.event.inputs.dry_run }}' -eq 'true') {
            Write-Host '::notice::Dry run - the bundle is built and assembled but nothing is uploaded.'
            $deployArgs.DryRun = $true
          }
          & .\scripts\deploy-cpanel.ps1 @deployArgs

      # The Linux-sharp assertion lives in deploy-cpanel.ps1, at the only point
      # where the assembled bundle still exists — the dry-run path deletes the
      # bundle and the archive as soon as it reports the skipped upload, so a
      # check here silently found nothing and passed.
