name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm_app_root:
        description: 'Type the Passenger app root exactly (bornohin_app) to confirm the deploy target'
        required: true
      dry_run:
        description: 'Build and assemble the release bundle but upload nothing. Run this first after any change to the deploy path.'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      # checks.listForRef backs the green-CI gate below; without this the gate
      # fails with "Resource not accessible by integration" and blocks every
      # deploy regardless of whether CI passed.
      checks: read

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      DEPLOY_RESTART_TOKEN: ${{ secrets.DEPLOY_RESTART_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # workflow_dispatch will happily ship any ref, including one CI never saw.
      # Require a successful CI run for this exact SHA before touching
      # production. deploy-cpanel.ps1 also runs lint/typecheck/test itself, but
      # it has no database, so only CI proves the integration suite passed.
      - name: Require green CI for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const runs = data.check_runs.map(r => `${r.name}=${r.conclusion ?? r.status}`);
            const ok = data.check_runs.some(r => r.name === 'ci' && r.conclusion === 'success');
            if (!ok) {
              // List what was actually found: a renamed CI job would otherwise
              // block every deploy with no clue why.
              core.setFailed(
                `No successful 'ci' check for ${context.sha}. Found: ${runs.join(', ') || '(none)'}. ` +
                `Push this commit through CI before deploying.`
              );
            } else {
              core.info(`CI is green for ${context.sha}.`);
            }

      - name: Preflight
        shell: pwsh
        run: .\scripts\cpanel-preflight.ps1

      - name: Deploy to cPanel
        shell: pwsh
        run: |
          # Not $args — that is an automatic variable in PowerShell.
          $deployArgs = @('-AppRoot','bornohin_app','-ConfirmAppRoot','${{ github.event.inputs.confirm_app_root }}')
          if ('${{ github.event.inputs.dry_run }}' -eq 'true') {
            Write-Host '::notice::Dry run - the bundle is built and assembled but nothing is uploaded.'
            $deployArgs += '-DryRun'
          }
          & .\scripts\deploy-cpanel.ps1 @deployArgs

      # The bundle must carry a Linux sharp runtime whatever host built it. This
      # asserts it from outside the script that produces it, so a regression in
      # the bundling logic fails the deploy rather than silently shipping a
      # release whose /_next/image requests all fail.
      - name: Verify the release bundle carries a loadable Linux sharp
        shell: pwsh
        run: |
          $img = 'deploy-package/node_modules/@img'
          if (-not (Test-Path $img)) { Write-Host '::notice::no @img in bundle; sharp is not part of this release'; exit 0 }
          $node = Join-Path $img 'sharp-linux-x64/lib/sharp-linux-x64.node'
          $vips = Get-ChildItem -Path $img -Recurse -Filter 'libvips-cpp.so*' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not (Test-Path $node)) { Write-Error "Missing $node"; exit 1 }
          if (-not $vips) { Write-Error 'Missing libvips shared library next to the linux sharp binary'; exit 1 }
          if (Test-Path (Join-Path $img 'sharp-win32-x64')) { Write-Error 'A win32 sharp binary is still in the Linux release bundle'; exit 1 }
          Write-Host "OK: $node and $($vips.Name)"
