name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm_app_root:
        description: 'Type the Passenger app root exactly (bornohin_app) to confirm the deploy target'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      DEPLOY_RESTART_TOKEN: ${{ secrets.DEPLOY_RESTART_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # workflow_dispatch will happily ship any ref, including one CI never saw.
      # Require a successful CI run for this exact SHA before touching
      # production. deploy-cpanel.ps1 also runs lint/typecheck/test itself, but
      # it has no database, so only CI proves the integration suite passed.
      - name: Require green CI for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              check_name: 'ci',
            });
            const ok = data.check_runs.some(r => r.conclusion === 'success');
            if (!ok) {
              core.setFailed(`No successful CI run for ${context.sha}. Push it through CI before deploying.`);
            }

      - name: Preflight
        shell: pwsh
        run: .\scripts\cpanel-preflight.ps1

      - name: Deploy to cPanel
        shell: pwsh
        run: .\scripts\deploy-cpanel.ps1 -AppRoot bornohin_app -ConfirmAppRoot "${{ github.event.inputs.confirm_app_root }}"
