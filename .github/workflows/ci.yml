name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # The integration suite in tests/persistence.test.ts skips itself when
    # DATABASE_URL is absent. Without a database here, CI reported green while
    # never executing the 13 tests that cover the data layer — the layer where
    # every critical finding in docs/AUDIT-2026-08-05.md lived.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ecommerce_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # A schema.prisma change with no matching migration builds and tests
      # clean, then fails on deploy against the real database. That drift has
      # already reached main once (7a76df3).
      - name: Check migrations reproduce schema.prisma
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build standalone app
        run: npm run build

      # A production ops script has already shipped with a parse error (c14fee4).
      # Nothing else in CI ever opens these files.
      - name: Parse-check PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=scripts/$($_.Name)::$($errs.Count) parse error(s)"
              $errs | ForEach-Object { Write-Host "  $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
