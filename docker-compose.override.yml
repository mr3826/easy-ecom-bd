services:
  app:
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - uploads:/uploads
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

  prisma-studio:
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - uploads:/uploads

